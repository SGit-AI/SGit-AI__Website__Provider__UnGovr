- id: census-cost
  state: projected
  date: 9 Sep 2026
  group: Arithmetic, with the workings shown
  claim: "A **census** of the law edge — as opposed to the sample above — is one detail request per entity: 327,138 requests. At the free tier's 100 a day that is **3,271 days, about 9 years**. At the metered rate of $0.001 it is **$327.14**. Re-do the arithmetic with your own numbers; the only input is the entity count."
  source: "327,138 ÷ 100 = 3,271 days; 327,138 × $0.001 = $327.14"

