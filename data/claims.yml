  claim: "The decks here are **rendered at build time, not read live from the vault** — a deliberate departure from sgit.ai's decks-from-a-vault brief, which specifies a host that fetches deck sources with a read key and runs them in sandboxed opaque-origin frames. **That architecture exists because vault bytes are untrusted input to a host page; this site's constraint is different**: every page is static and contacts nothing, with exactly two named exceptions, and a live viewer would have made every deck page a third. **The cost is liveness** — when the vault moves ahead, this site is behind and says so. The live decks are the vault app's own Decks view, one click away on `/vault/` and `/estate/`."
