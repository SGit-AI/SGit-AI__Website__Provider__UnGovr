- id: ai-vocab-not-graph
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "The nearest thing to an ontology is the AI-law corpus's `vocab.json`: **4 verdicts, 6 contexts, 6 crawl-policy fields, 22 field definitions and 17 enums**, with a JSON Schema at `ungovr.ai-laws/2`. It is a real controlled vocabulary — every enum value defined in prose. **It is not a graph**: no classes, no properties with domains and ranges, no relations between terms, no SKOS, OWL, RDF or JSON-LD. The schema document is public; the data behind it is key-gated and its licence states *\"No license is conveyed by receipt of this file.\"* The only occurrence of the word *graph* in their entire OpenAPI is `GeoJSON`."
