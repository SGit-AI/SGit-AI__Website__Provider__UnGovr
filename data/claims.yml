# The ledger. Every factual claim the site makes lives here once, with the state it
# earned and the date it earned it. Pages cite a claim with {{claim:id}}, which
# renders the chip and links back to /ledger/. The "where it is said" column is
# joined at build time, so a claim cannot quietly appear on a page unbadged.
#
# States: verified · measured · docs · spec · unrun · projected  (see build.py STATES)
#
# One rule specific to this site: a `docs` claim's source must be the URL it was
# read at, because a vendor claim without the page and the date is not checkable.
# tools/check_site.py enforces it.

