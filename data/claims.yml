- id: vault-embed-unrun
  state: unrun
  group: About this site itself
  claim: "**Nobody has watched the embed render.** The authoring container's proxy resets browser-initiated TLS tunnels — `curl` reaches `dev.vault.sgraph.ai` fine and returns 200 with no frame-blocking headers, but Chromium gets `ERR_CONNECTION_RESET` — so the frame could not be booted here. The component, the markup and the credential are verified; **the thing they produce has not been seen**. Open [the vault page](/vault/) in a real browser and it either works or it does not, which is exactly what this state means."
  source: "Playwright via the agent proxy: ERR_CONNECTION_RESET on the vault origin"
