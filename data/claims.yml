- id: machine-payments
  state: docs
  date: 9 Sep 2026
  group: Read in their documentation, 9 September 2026
  claim: "Above the free tier the API returns **HTTP 402 with a Machine Payments Protocol challenge**, paid per request from a Stripe-funded wallet: **$0.001** per entity request, **$0.01** per CGJ report detail, **$5.00** minimum top-up, carried on `WWW-Authenticate: Payment` / `Authorization: Payment` headers."
  source: "https://www.ungovr.org/open-data/api"

- id: api-key-free
  state: docs
  date: 9 Sep 2026
  group: Read in their documentation, 9 September 2026
  claim: "An API key is **free**, and most Open Data endpoints need none at all. The key raises rate limits and unlocks the gated corpora. So the bound on the ungated surface is a property of the *network path*, not of a credential."
  source: "https://www.ungovr.org/open-data/api-keys"

- id: licence-ccby
  state: docs
  date: 9 Sep 2026
  group: Read in their documentation, 9 September 2026
  claim: "The Open Data API is published under **CC BY 4.0**, declared in the OpenAPI document's own `license` block. Everything this site and its vault derive from it is used under that licence, with attribution."
