- id: vault-embed-pattern
  state: verified
  date: 9 Sep 2026
  group: About this site itself
  claim: "The vault embed is the estate's own published component, **vendored unmodified**: the body of `assets/vault-ui-embed.js` is byte-identical to `sgit.ai/assets/vault-ui-embed.js` (sha256 `6da5cf0a390dce25…`), the markup matches the estate's `sgv-uiembed` block attribute for attribute, and the only origin in its executable code is `dev.vault.sgraph.ai`. The key it publishes is the bare 64-hex read key, which a build check enforces."
