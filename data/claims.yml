- id: law-json-only
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "Every representation is JSON. `.md`, `.html`, `.txt`, `.pdf`, `.jsonld` and `.ttl` on a records-law path all return **404**. Content negotiation is not merely ignored — it is ignored *identically*: `Accept: text/markdown`, `Accept: application/ld+json` and no `Accept` header at all return the same document with **the same sha256 `b06492bfb34b9572…`, 6,749 bytes**. That is not a content-type header claiming JSON; it is the same bytes three times."
  source: "eight probes of /v1/laws/records/ad.json and its extension variants, all in the retrieval log"

- id: law-no-text
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "A records law comes back as a **structured research summary, not the instrument**: 31–34 top-level fields across a ten-jurisdiction sample, 29 of them present in every one. `exemptions[]` carries code, name, description and whether it is discretionary; `appeal_process[]` carries the tier, the body, the deadline in days and a contact URL. **The statute's own text appears in no field and in no format.**"
