- id: coverage-zero
  state: measured
  date: 9 Sep 2026
  group: Measured by our own pipeline, 9 September 2026
  claim: "**0 of 49.** In a seeded random sample of 49 entity-detail documents drawn across five strata, three countries and seventeen entity types, **not one carried a non-empty `open_records.law`** — including six US states, whose records laws are in UnGovr's own corpus. 95% Wilson interval **0.0–7.3%**. A missing law reference is not an error; the number measures how far the join can currently reach and is **not a defect count**."
  source: "bin/coverage-sample.py, seed 20260909, against frames whose sha256s are in the retrieval log"

- id: inferred-reach
  state: measured
  date: 9 Sep 2026
  group: Measured by our own pipeline, 9 September 2026
  claim: "The same join **inferred by slug prefix reaches 96.6%** of California's 16,071 entities — the longest law-corpus jurisdiction that is a path-prefix of the entity slug. The join is one derivable hop away, over data UnGovr already publish, and the rule is two lines long."
  source: "bin/inferred-join.py over /v1/entities/us/ca/all.json and /v1/laws/records/index.json"

- id: inferred-suspect
  state: measured
  date: 9 Sep 2026
  group: Measured by our own pipeline, 9 September 2026
  claim: "**20.5% of those matches would need a human.** Slug hierarchy is geography; records law is jurisdiction. They come apart for exactly the bodies a requester most often wants — interstate compacts, federal categories, tribal nations, regulated utilities, charter schools. That is why the edge is drawn `inferred` and not asserted."
  source: "bin/inferred-join.py, the matched-but-suspect column"

- id: entity-count-drift
  state: measured
  date: 9 Sep 2026
  group: Measured by our own pipeline, 9 September 2026
  claim: "The entity total is **327,138** in `/v1/meta/last-updated.json` and **327,138+** in the OpenAPI description, against 330,000 / 321,000 / 320,000 quoted on three of their pages earlier. Ordinary for a live dataset that rebuilds. **An observation, not a finding**, and not a conversation worth having."
  source: "/v1/meta/last-updated.json, built_at 2026-09-08T07:46:48Z"

