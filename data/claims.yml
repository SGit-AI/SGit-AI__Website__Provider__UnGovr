- id: schema-declares-law
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "`open_records` is declared in UnGovr's own published schema as a property of `entity_detail`, an object with one string member, `law`. It is **not** in that definition's `required` list. The join point is designed and optional."
  source: "/v1/meta/schema.json, sha256 ac7ce7e32a70c65d"

- id: law-not-in-bulk
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "`open_records` appears in exactly one place in the API — the per-entity detail document. It is absent from every bulk surface, which UnGovr's own OpenAPI states: the full-depth index is *\"a compact record ({slug, name, type, parent_slug?, population?})\"*. So the coverage of this edge cannot be computed from any bulk artefact by anyone."
  source: "/v1/meta/openapi.yaml, sha256 5c344d97b440690d, and the retrieved index files"

- id: sb-detail-no-law
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "The detail document for Santa Barbara County carries **no `open_records` key at all**. Nor does California itself (`us/ca`), whose records law is in UnGovr's own corpus."
  source: "/v1/entities/detail/us--ca--santa-barbara.json, sha256 8d5e6db9e4056b2f"

- id: cpra-in-corpus
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "The records-law corpus **is sub-national**: 254 of its 398 rows are, and `us/ca` is the California Public Records Act, `Cal. Gov. Code §§ 7920.000-7931.000`. Its full record carries structured obligation data — `initial_response_days: 10`, `extension_days: 14`, `private_right_of_action: true`, fee rates, submission methods and required elements. **This is better than the brief that commissioned this work assumed**, and the correction is filed."
  source: "/v1/laws/records/us--ca.json, sha256 ce8bc4744115befd"

- id: provision-confirmed
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "The vault's pack named `Gov. Code § 7922.535` as a *candidate to verify*, written from prior knowledge and therefore `unevidenced` by its own rule. **The retrieved bytes carry it**: `response_deadline_notes` cites § 7922.535(a) for the determination and (b)-(c) for the extension. The candidate is confirmed by the source rather than by memory."
  source: "/v1/laws/records/us--ca.json, field response_deadline_notes"

- id: provision-not-addressable
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "That citation is **prose inside a free-text field**, not an addressable node. There is no `provisions` array, no clause identifiers and no byte ranges, so nothing below the law can be pointed at, cited, or attached to evidence."
  source: "/v1/laws/records/us--ca.json — the record's full key set"

- id: cpra-no-akn
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "The CPRA has no Akoma Ntoso or other XML serialisation to retrieve. Both source URLs in the law record resolve to `leginfo.legislature.ca.gov`, which serves `text/html` from a JSF page. **This closes blocker B3, and it means acceptance test 3 — rebuild the instrument byte for byte from the graph — cannot pass for this instrument.** The test is recorded as unpassable here rather than weakened."
  source: "leginfo.legislature.ca.gov, both URLs fetched; Content-Type: text/html"

- id: source-url-mismatch
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "The CPRA record's two source URLs point at different codifications: `law_url` at Division 10, Title 1 (the current §§ 7920–7931) and `primary_source_url` at Division 7, Chapter 3.5 — the location the CPRA occupied **before the 2023 recodification**. One of the two is stale. It is a small, specific, checkable thing they would probably want to know."
  source: "/v1/laws/records/us--ca.json, fields law_url and primary_source_url"

- id: products-undocumented
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "A `products` array is returned by **49 of 49** entity-detail documents sampled and appears nowhere in the published JSON Schema. So the schema is behind the API in one direction while `open_records` is ahead of it in the other. Ordinary drift in a live dataset, recorded as an observation."
  source: "the 49 detail documents of the coverage sample"

- id: no-ratelimit-headers
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "`X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-Quota-Remaining` are advertised in the API's `Access-Control-Expose-Headers` but **were not emitted on any of the 70 open-endpoint responses** taken here. A client cannot see how much of its daily budget is left until the budget runs out."
  source: "the saved response headers for every retrieval in the log"

- id: head-405
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "`HEAD` returns **405** where `GET` returns 200, so a client cannot cheaply size a file before downloading it. `GET` does return a strong `ETag`, which is the better tool anyway."
  source: "HEAD https://data.ungovr.org/v1/entities/us.json"

- id: ai-laws-gated
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "`/v1/ai-laws/index.json` answers **401** without a key, and its response advertises **two different credential mechanisms**: the body says `X-API-Key`, while the `WWW-Authenticate` header offers OAuth 2.0 Protected Resource Metadata — `Bearer resource_metadata=\"…/.well-known/oauth-protected-resource\", scope=\"opendata:read\"`. **Blocker B2 is now closed**: a key was issued to this project and the corpus was read."
  source: "/v1/ai-laws/index.json and /.well-known/oauth-protected-resource"

- id: authorization-ignored
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**Only one of those two mechanisms works.** The same valid key returns **200** as `X-API-Key` and **401** as `Authorization: Bearer` — byte-identical to the anonymous response. So the OAuth Protected Resource Metadata advertised in the `WWW-Authenticate` header is discovery for an authorization flow the Open Data API does not accept, and an MCP or OAuth client that follows it is **silently treated as anonymous**. Their own key page states this; the 401 header does not."
  source: "three requests to /v1/ai-laws/index.json: none, Bearer, X-API-Key"

- id: ai-laws-is-instruments
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**The AI-law corpus is not a bare verdict, and the brief that commissioned this work was wrong to expect one.** `ungovr.ai-laws/2` carries **2,915 instruments across 271 jurisdictions** — 200 national, 56 sub-national, 14 local — each with a citation, a URL, a status and an effective date; plus, per access scenario, a `basis` naming the controlling authority (Van Buren 2021, hiQ v LinkedIn, Ziff Davis v OpenAI 2025) and a `provenance` block with `as_of_date`, `confidence` and `stale`. **A reader can check it and can disagree at the level where disagreement is useful.** Correction C8."
  source: "/v1/ai-laws/index.json and /v1/ai-laws/us.json, read under key"

- id: ai-laws-licence
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**Two licences are in force on one API, and they disagree.** The OpenAPI document declares the whole Open Data API **CC BY 4.0**. The AI-law payloads carry their own `license` block — *\"UnGovr Data License (non-exclusive, by agreement)\"* — whose `grant` field reads **\"No license is conveyed by receipt of this file.\"** The specific term governs, so **that corpus is not open data and is not redistributed by this site or its vault**; it is described and measured only. A consumer reading only the OpenAPI licence would get this wrong."
  source: "the license block in /v1/ai-laws/us.json and /v1/ai-laws/export/manifest.json"

- id: shared-quota
  state: docs
  date: 9 Sep 2026
  group: Read in their documentation, 9 September 2026
  claim: "Multiple API keys on one account **share a single daily allowance** — *\"connecting a second client does not buy a second free tier\"*. So a key is a revocation handle, not a budget: issuing one per machine limits blast radius without raising throughput, which is the right trade and worth knowing before planning around it."
  source: "https://www.ungovr.org/open-data/api-keys"

