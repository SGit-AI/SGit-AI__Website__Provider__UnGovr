- id: ai-laws-gated
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "`/v1/ai-laws/index.json` answers **401** without a key, and its response advertises **two different credential mechanisms**: the body says `X-API-Key`, while the `WWW-Authenticate` header offers OAuth 2.0 Protected Resource Metadata — `Bearer resource_metadata=\"…/.well-known/oauth-protected-resource\", scope=\"opendata:read\"`. **Blocker B2 is now closed**: a key was issued to this project and the corpus was read."
  source: "/v1/ai-laws/index.json and /.well-known/oauth-protected-resource"

- id: authorization-ignored
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**Only one of those two mechanisms works.** The same valid key returns **200** as `X-API-Key` and **401** as `Authorization: Bearer` — byte-identical to the anonymous response. So the OAuth Protected Resource Metadata advertised in the `WWW-Authenticate` header is discovery for an authorization flow the Open Data API does not accept, and an MCP or OAuth client that follows it is **silently treated as anonymous**. Their own key page states this; the 401 header does not."
  source: "three requests to /v1/ai-laws/index.json: none, Bearer, X-API-Key"

- id: ai-laws-is-instruments
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**The AI-law corpus is not a bare verdict, and the brief that commissioned this work was wrong to expect one.** `ungovr.ai-laws/2` carries **2,915 instruments across 271 jurisdictions** — 200 national, 56 sub-national, 14 local — each with a citation, a URL, a status and an effective date; plus, per access scenario, a `basis` naming the controlling authority (Van Buren 2021, hiQ v LinkedIn, Ziff Davis v OpenAI 2025) and a `provenance` block with `as_of_date`, `confidence` and `stale`. **A reader can check it and can disagree at the level where disagreement is useful.** Correction C8."
  source: "/v1/ai-laws/index.json and /v1/ai-laws/us.json, read under key"

- id: ai-laws-licence
  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**Two licences are in force on one API, and they disagree.** The OpenAPI document declares the whole Open Data API **CC BY 4.0**. The AI-law payloads carry their own `license` block — *\"UnGovr Data License (non-exclusive, by agreement)\"* — whose `grant` field reads **\"No license is conveyed by receipt of this file.\"** The specific term governs, so **that corpus is not open data and is not redistributed by this site or its vault**; it is described and measured only. A consumer reading only the OpenAPI licence would get this wrong."
  source: "the license block in /v1/ai-laws/us.json and /v1/ai-laws/export/manifest.json"

- id: shared-quota
  state: docs
  date: 9 Sep 2026
  group: Read in their documentation, 9 September 2026
  claim: "Multiple API keys on one account **share a single daily allowance** — *\"connecting a second client does not buy a second free tier\"*. So a key is a revocation handle, not a budget: issuing one per machine limits blast radius without raising throughput, which is the right trade and worth knowing before planning around it."
  source: "https://www.ungovr.org/open-data/api-keys"

