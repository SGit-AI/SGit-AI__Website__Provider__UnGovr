  state: verified
  date: 9 Sep 2026
  group: Run against the API, 9 September 2026
  claim: "**254 of the 398 records laws are sub-national and none has a reachable detail document.** Their `jurisdiction` carries a slash (`us/ms`, `br/minas-gerais`, `au/nt`) and the detail route is a single path segment, so **24 of 24 sampled returned 404 while 26 of 26 national ones returned 200**. Raw, percent-encoded and dash-substituted forms all fail. They are not absent from the corpus — they are in the index with citation, source URL and response days; it is the 30-odd-field document that cannot be addressed. **Sub-national is exactly where jurisdictional variation lives.**"
