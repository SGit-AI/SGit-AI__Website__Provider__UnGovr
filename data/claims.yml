  state: docs
  date: 9 Sep 2026
  group: Read in their documentation, 9 September 2026
  claim: "Free tier, per their rate-limit table: **entity data 100/day per IP**; CGJ indices and county listings **unlimited**; CGJ report detail **50/day per key**; conditional revalidation (`304`) free at up to **5,000 per key per day**, past which the API returns `429` with `Retry-After`."
